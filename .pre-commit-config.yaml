repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: secret-scan
        name: Secret Pattern Scan
        entry: python -c "
import sys, re, pathlib;
patterns = [
    r'(?i)(password|secret|api.?key|token)\s*[:=]\s*[\"\\'][^\"\\']{8,}',
    r'(?i)AKIA[0-9A-Z]{16}',
    r'-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----',
];
files = sys.argv[1:];
found = False;
for f in files:
    try:
        content = pathlib.Path(f).read_text(errors='ignore');
        for p in patterns:
            if re.search(p, content):
                print(f'SECRET DETECTED in {f}');
                found = True;
                break;
    except Exception:
        pass;
sys.exit(1 if found else 0)
"
        language: system
        types: [text]
        pass_filenames: true
      - id: no-env-files
        name: Block .env files
        entry: python -c "
import sys;
blocked = [f for f in sys.argv[1:] if f.endswith(('.env', '.key', '.pem')) or '.env.' in f];
[print(f'BLOCKED: {f}') for f in blocked];
sys.exit(1 if blocked else 0)
"
        language: system
        types: [text]
        pass_filenames: true
