[project]
name = "aeros"
version = "0.1.0"
description = "AI Procurement OS — conversational RFx drafting, format-agnostic offer intake, side-by-side comparison"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.0.0",
    "httpx>=0.27.0",
    "huey>=2.5.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.0.0",
    "openai>=1.50.0",
    "structlog>=24.0.0",
    "aiosmtplib>=3.0.0",
    "IMAPClient>=3.0.0",
    "bleach>=6.0.0",
    "PyMuPDF>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "weasyprint>=62.0",
    "Pillow>=10.0.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
telegram = [
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "vcrpy>=6.0.0",
    "aiosmtpd>=1.4.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeros"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "A", "C4", "DTZ", "T20", "RUF"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["aeros"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/aeros --cov-report=term-missing"

[tool.coverage.run]
source = ["src/aeros"]
omit = ["src/aeros/seed/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
